<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul Klein</title>
    <style>
        @font-face {
            font-family: 'Aeonik';
            src: url('Aeonik-Medium.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        #container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 40px;
        }

        #ascii-container {
            width: 100%;
            height: 100%;
            font-family: 'Courier New', monospace;
            font-size: 8px;
            line-height: 8px;
            white-space: pre;
            color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #ascii-output {
            letter-spacing: 0px;
        }

        #info-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #info-layer.visible {
            opacity: 1;
        }

        .info-content {
            text-align: center;
            color: #000;
            font-family: 'Aeonik', 'Helvetica Neue', Arial, sans-serif;
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem 3rem;
            border-radius: 4px;
        }

        .info-content h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 500;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .info-content p {
            font-size: clamp(0.75rem, 1.5vw, 1.1rem);
            opacity: 0.6;
            margin-bottom: 0.25rem;
        }

        .info-content .email {
            margin-top: 1rem;
            opacity: 1;
        }

        .info-content a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            padding-bottom: 2px;
            transition: border-color 0.3s;
            pointer-events: auto;
        }

        .info-content a:hover {
            border-color: #000;
        }

        .hint {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #aaa;
            z-index: 10;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="info-layer">
        <div class="info-content">
            <h1>Paul Klein</h1>
            <p>Code Creator & Problem Solver</p>
            <p>San Francisco</p>
            <p class="email">
                <a href="mailto:paul@paulkle.in">paul@paulkle.in</a>
            </p>
        </div>
    </div>

    <div id="container">
        <div id="ascii-container">
            <pre id="ascii-output"></pre>
        </div>
    </div>

    <div class="hint">hover to reveal</div>

    <script>
        // ASCII characters from light to dark
        const ASCII_CHARS = ' .`\'^",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';

        // Configuration
        const config = {
            charWidth: 5,
            charHeight: 8,
            waveSpeed: 0.4,
            mouseRadius: 80
        };

        // State
        let cols, rows;
        let mouse = { x: -1000, y: -1000 };
        let smoothMouse = { x: -1000, y: -1000 };
        let isMouseActive = false;
        let time = 0;

        function init() {
            resize();
            window.addEventListener('resize', resize);

            document.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                isMouseActive = true;
            });

            document.addEventListener('mouseleave', () => {
                isMouseActive = false;
            });

            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    mouse.x = e.touches[0].clientX;
                    mouse.y = e.touches[0].clientY;
                    isMouseActive = true;
                }
            }, { passive: true });

            document.addEventListener('touchend', () => {
                isMouseActive = false;
            });

            animate();
        }

        function resize() {
            const container = document.getElementById('container');
            cols = Math.floor(container.clientWidth / config.charWidth);
            rows = Math.floor(container.clientHeight / config.charHeight);
        }

        // Great Wave shape function
        function getWaveHeight(x, t) {
            const nx = x / cols;

            // Main wave crest (the big curl)
            const mainWavePeak = 0.35;
            const mainWaveWidth = 0.25;
            const distFromPeak = Math.abs(nx - mainWavePeak);

            // Main wave shape - tall peak that curls over
            let mainWave = Math.exp(-distFromPeak * distFromPeak / (mainWaveWidth * mainWaveWidth)) * 0.85;

            // Add the curl at the top
            if (nx > 0.2 && nx < 0.5) {
                const curlFactor = Math.sin((nx - 0.2) * Math.PI / 0.3);
                mainWave += curlFactor * 0.15 * Math.exp(-distFromPeak * 8);
            }

            // Secondary wave (smaller, to the right)
            const secondPeak = 0.7;
            const distFromSecond = Math.abs(nx - secondPeak);
            const secondWave = Math.exp(-distFromSecond * distFromSecond / 0.04) * 0.45;

            // Third smaller wave
            const thirdPeak = 0.85;
            const distFromThird = Math.abs(nx - thirdPeak);
            const thirdWave = Math.exp(-distFromThird * distFromThird / 0.02) * 0.25;

            // Combine waves
            let height = Math.max(mainWave, secondWave, thirdWave);

            // Add animated ripples
            height += Math.sin(nx * 20 + t * 2) * 0.02;
            height += Math.sin(nx * 35 - t * 1.5) * 0.015;

            // Base ocean level
            height = Math.max(height, 0.08 + Math.sin(nx * 8 + t) * 0.02);

            return height;
        }

        // Foam/spray pattern
        function getFoamIntensity(x, y, t) {
            const nx = x / cols;
            const ny = y / rows;

            // Foam at wave crests
            const waveHeight = getWaveHeight(x, t);
            const normalizedY = 1 - ny;

            // Only show foam near the wave surface
            const distFromSurface = Math.abs(normalizedY - waveHeight);

            if (distFromSurface < 0.05 && normalizedY <= waveHeight + 0.02) {
                // Spray particles at the curl
                if (nx > 0.25 && nx < 0.5 && normalizedY > 0.6) {
                    const spray = Math.sin(x * 3 + y * 2 + t * 5) * 0.5 + 0.5;
                    const sprayNoise = Math.sin(x * 7.3 + t * 3) * Math.cos(y * 5.1 - t * 2);
                    if (sprayNoise > 0.3 + spray * 0.3) {
                        return 0.9;
                    }
                }
                return 0.7 + Math.sin(x * 5 + t * 3) * 0.2;
            }

            return 0;
        }

        // Get wave density at a point
        function getWaveDensity(x, y, t) {
            const nx = x / cols;
            const ny = y / rows;
            const normalizedY = 1 - ny; // Flip Y so 0 is bottom

            const waveHeight = getWaveHeight(x, t);

            // Sky (above wave)
            if (normalizedY > waveHeight + 0.03) {
                // Add some spray particles in the sky near the main wave
                if (nx > 0.2 && nx < 0.55 && normalizedY < waveHeight + 0.2) {
                    const sprayChance = Math.sin(x * 11 + y * 7 + t * 4) * Math.cos(x * 13 - t * 3);
                    if (sprayChance > 0.7) {
                        return 0.3 + Math.random() * 0.2;
                    }
                }
                return 0;
            }

            // Wave body
            if (normalizedY <= waveHeight) {
                // Distance from surface (for shading)
                const depth = waveHeight - normalizedY;

                // Base density increases with depth
                let density = 0.3 + depth * 2;

                // Add wave texture/lines
                const waveLines = Math.sin(nx * 40 + normalizedY * 30 + t * 0.5);
                density += waveLines * 0.15;

                // Foam at the top
                if (depth < 0.05) {
                    const foam = getFoamIntensity(x, y, t);
                    density = Math.max(density, foam);
                }

                // Curl detail
                if (nx > 0.28 && nx < 0.45 && normalizedY > 0.5) {
                    const curlDetail = Math.sin((nx - 0.28) * 50 + normalizedY * 20 + t);
                    density += curlDetail * 0.2;
                }

                return Math.min(1, Math.max(0, density));
            }

            return 0;
        }

        function animate() {
            time += 0.016 * config.waveSpeed;

            // Smooth mouse
            smoothMouse.x += (mouse.x - smoothMouse.x) * 0.1;
            smoothMouse.y += (mouse.y - smoothMouse.y) * 0.1;

            const container = document.getElementById('container');
            const rect = container.getBoundingClientRect();

            let ascii = '';
            let hasHole = false;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const screenX = rect.left + x * config.charWidth + config.charWidth / 2;
                    const screenY = rect.top + y * config.charHeight + config.charHeight / 2;

                    // Mouse hole
                    const dx = screenX - smoothMouse.x;
                    const dy = screenY - smoothMouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const holeAmount = isMouseActive ? Math.max(0, 1 - distance / config.mouseRadius) : 0;
                    const smoothHole = holeAmount * holeAmount * holeAmount;

                    if (smoothHole > 0.3) hasHole = true;

                    if (smoothHole > 0.5) {
                        ascii += ' ';
                    } else {
                        let density = getWaveDensity(x, y, time);

                        // Apply hole fade
                        density *= (1 - smoothHole);

                        if (density < 0.05) {
                            ascii += ' ';
                        } else {
                            const charIndex = Math.floor(density * (ASCII_CHARS.length - 1));
                            ascii += ASCII_CHARS[Math.min(ASCII_CHARS.length - 1, charIndex)];
                        }
                    }
                }
                ascii += '\n';
            }

            document.getElementById('ascii-output').textContent = ascii;

            const infoLayer = document.getElementById('info-layer');
            if (hasHole) {
                infoLayer.classList.add('visible');
            } else {
                infoLayer.classList.remove('visible');
            }

            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
