<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul Klein</title>
    <style>
        @font-face {
            font-family: 'Aeonik';
            src: url('Aeonik-Medium.ttf') format('truetype');
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #fff;
            overflow: hidden;
        }
        #canvas {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #info-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #info-layer.visible { opacity: 1; }
        .info-content {
            text-align: center;
            color: #000;
            font-family: 'Aeonik', sans-serif;
            background: rgba(255,255,255,0.95);
            padding: 2rem 3rem;
            border-radius: 4px;
        }
        .info-content h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        .info-content p {
            font-size: clamp(0.75rem, 1.5vw, 1.1rem);
            opacity: 0.6;
            margin-bottom: 0.25rem;
        }
        .info-content .email { margin-top: 1rem; opacity: 1; }
        .info-content a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            pointer-events: auto;
        }
        .hint {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #aaa;
            z-index: 10;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="info-layer">
        <div class="info-content">
            <h1>Paul Klein</h1>
            <p>Code Creator & Problem Solver</p>
            <p>San Francisco</p>
            <p class="email">
                <a href="mailto:paul@paulkle.in">paul@paulkle.in</a>
            </p>
        </div>
    </div>
    <canvas id="canvas"></canvas>
    <div class="hint">hover to reveal</div>

    <script>
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');

        let time = 0;
        let mouse = { x: -9999, y: -9999 };
        let mouseActive = false;

        // Shader sources
        const vertexShaderSrc = `
            attribute vec3 position;
            uniform mat4 projection;
            uniform mat4 view;
            uniform float time;
            varying float vHeight;
            varying vec3 vPos;

            void main() {
                vec3 pos = position;
                float x = pos.x;
                float z = pos.z;

                // Normalize x to 0-1 range
                float nx = (x + 15.0) / 30.0;

                // Great Wave shape
                float height = 0.0;

                // Main curling wave crest
                float crestX = 0.25;
                float distFromCrest = nx - crestX;

                // The big wave
                if (nx < 0.55) {
                    float rise = pow(max(0.0, 1.0 - abs(distFromCrest) * 2.5), 2.0);
                    height += rise * 12.0;

                    // The curl/claw at the top
                    if (nx > 0.15 && nx < 0.45) {
                        float curl = sin((nx - 0.15) * 3.14159 / 0.3);
                        float curlHeight = curl * 4.0 * exp(-distFromCrest * distFromCrest * 15.0);
                        // Make it curl forward
                        height += curlHeight;
                    }
                }

                // Secondary wave
                float dist2 = abs(nx - 0.72);
                height += exp(-dist2 * dist2 * 40.0) * 5.0;

                // Small wave
                float dist3 = abs(nx - 0.88);
                height += exp(-dist3 * dist3 * 60.0) * 2.5;

                // Animated ripples
                height += sin(nx * 15.0 + time * 2.0) * 0.3;
                height += sin(z * 0.5 + time * 1.5) * 0.2;

                // Vary along z
                float zFade = 1.0 - abs(z) / 20.0;
                height *= zFade * zFade;

                pos.y = height;
                vHeight = height;
                vPos = pos;

                gl_Position = projection * view * vec4(pos, 1.0);
                gl_PointSize = 2.5;
            }
        `;

        const fragmentShaderSrc = `
            precision mediump float;
            varying float vHeight;
            varying vec3 vPos;
            uniform vec2 mouse;
            uniform float mouseActive;
            uniform vec2 resolution;

            void main() {
                // Calculate screen position
                vec2 screenPos = gl_FragCoord.xy;

                // Mouse hole effect
                float dist = length(screenPos - mouse);
                float hole = mouseActive * max(0.0, 1.0 - dist / 80.0);
                hole = hole * hole;

                if (hole > 0.5) {
                    discard;
                }

                // Base color - black
                float alpha = 1.0 - hole;

                // Make points circular
                vec2 pc = gl_PointCoord - 0.5;
                if (length(pc) > 0.5) discard;

                gl_FragColor = vec4(0.0, 0.0, 0.0, alpha);
            }
        `;

        function createShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function createProgram(vs, fs) {
            const program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error(gl.getProgramInfoLog(program));
                return null;
            }
            return program;
        }

        // Create shaders and program
        const vertexShader = createShader(gl.VERTEX_SHADER, vertexShaderSrc);
        const fragmentShader = createShader(gl.FRAGMENT_SHADER, fragmentShaderSrc);
        const program = createProgram(vertexShader, fragmentShader);

        // Get locations
        const positionLoc = gl.getAttribLocation(program, 'position');
        const projectionLoc = gl.getUniformLocation(program, 'projection');
        const viewLoc = gl.getUniformLocation(program, 'view');
        const timeLoc = gl.getUniformLocation(program, 'time');
        const mouseLoc = gl.getUniformLocation(program, 'mouse');
        const mouseActiveLoc = gl.getUniformLocation(program, 'mouseActive');
        const resolutionLoc = gl.getUniformLocation(program, 'resolution');

        // Create points grid
        const points = [];
        const gridX = 200;
        const gridZ = 100;
        for (let i = 0; i < gridX; i++) {
            for (let j = 0; j < gridZ; j++) {
                const x = (i / gridX - 0.5) * 30;
                const z = (j / gridZ - 0.5) * 20;
                points.push(x, 0, z);
            }
        }

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(points), gl.STATIC_DRAW);

        // Matrix functions
        function ortho(left, right, bottom, top, near, far) {
            return new Float32Array([
                2 / (right - left), 0, 0, 0,
                0, 2 / (top - bottom), 0, 0,
                0, 0, -2 / (far - near), 0,
                -(right + left) / (right - left), -(top + bottom) / (top - bottom), -(far + near) / (far - near), 1
            ]);
        }

        function lookAt(eye, target, up) {
            const zAxis = normalize(subtract(eye, target));
            const xAxis = normalize(cross(up, zAxis));
            const yAxis = cross(zAxis, xAxis);
            return new Float32Array([
                xAxis[0], yAxis[0], zAxis[0], 0,
                xAxis[1], yAxis[1], zAxis[1], 0,
                xAxis[2], yAxis[2], zAxis[2], 0,
                -dot(xAxis, eye), -dot(yAxis, eye), -dot(zAxis, eye), 1
            ]);
        }

        function subtract(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
        function cross(a, b) { return [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]]; }
        function dot(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
        function normalize(v) { const l = Math.sqrt(dot(v, v)); return [v[0]/l, v[1]/l, v[2]/l]; }

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const w = Math.min(window.innerWidth * 0.9, 1200);
            const h = Math.min(window.innerHeight * 0.7, 700);
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            gl.viewport(0, 0, canvas.width, canvas.height);
        }

        function render() {
            time += 0.016;

            gl.clearColor(1, 1, 1, 1);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

            gl.useProgram(program);

            // Isometric view
            const aspect = canvas.width / canvas.height;
            const d = 18;
            const projection = ortho(-d * aspect, d * aspect, -d, d, -100, 100);
            const view = lookAt([30, 25, 30], [0, 3, 0], [0, 1, 0]);

            gl.uniformMatrix4fv(projectionLoc, false, projection);
            gl.uniformMatrix4fv(viewLoc, false, view);
            gl.uniform1f(timeLoc, time);

            // Convert mouse to canvas coordinates
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const mx = (mouse.x - rect.left) * dpr;
            const my = canvas.height - (mouse.y - rect.top) * dpr;
            gl.uniform2f(mouseLoc, mx, my);
            gl.uniform1f(mouseActiveLoc, mouseActive ? 1.0 : 0.0);
            gl.uniform2f(resolutionLoc, canvas.width, canvas.height);

            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.enableVertexAttribArray(positionLoc);
            gl.vertexAttribPointer(positionLoc, 3, gl.FLOAT, false, 0, 0);

            gl.drawArrays(gl.POINTS, 0, points.length / 3);

            // Check if mouse is creating a hole for info layer
            const infoLayer = document.getElementById('info-layer');
            if (mouseActive && mouse.x > rect.left && mouse.x < rect.right &&
                mouse.y > rect.top && mouse.y < rect.bottom) {
                infoLayer.classList.add('visible');
            } else {
                infoLayer.classList.remove('visible');
            }

            requestAnimationFrame(render);
        }

        // Events
        document.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouseActive = true;
        });
        document.addEventListener('mouseleave', () => mouseActive = false);
        document.addEventListener('touchmove', e => {
            if (e.touches[0]) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
                mouseActive = true;
            }
        }, { passive: true });
        document.addEventListener('touchend', () => mouseActive = false);
        window.addEventListener('resize', resize);

        resize();
        render();
    </script>
</body>
</html>
