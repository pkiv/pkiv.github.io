<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul Klein</title>
    <style>
        @font-face {
            font-family: 'Aeonik';
            src: url('Aeonik-Medium.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        #ascii-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 14px;
            white-space: pre;
            color: #000;
            overflow: hidden;
        }

        #ascii-output {
            letter-spacing: 1px;
        }

        #info-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #info-layer.visible {
            opacity: 1;
        }

        .info-content {
            text-align: center;
            color: #000;
            font-family: 'Aeonik', 'Helvetica Neue', Arial, sans-serif;
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem 3rem;
            border-radius: 4px;
        }

        .info-content h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 500;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .info-content p {
            font-size: clamp(0.75rem, 1.5vw, 1.1rem);
            opacity: 0.6;
            margin-bottom: 0.25rem;
        }

        .info-content .email {
            margin-top: 1rem;
            opacity: 1;
        }

        .info-content a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            padding-bottom: 2px;
            transition: border-color 0.3s;
            pointer-events: auto;
        }

        .info-content a:hover {
            border-color: #000;
        }

        .hint {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #aaa;
            z-index: 10;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="info-layer">
        <div class="info-content">
            <h1>Paul Klein</h1>
            <p>Code Creator & Problem Solver</p>
            <p>San Francisco</p>
            <p class="email">
                <a href="mailto:paul@paulkle.in">paul@paulkle.in</a>
            </p>
        </div>
    </div>

    <div id="ascii-container">
        <pre id="ascii-output"></pre>
    </div>

    <div class="hint">hover to reveal</div>

    <script>
        // ASCII characters from light to dark
        const ASCII_CHARS = ' .,:;+*?%S#@';

        // Configuration
        const config = {
            charWidth: 7,
            charHeight: 14,
            waveSpeed: 0.8,
            mouseRadius: 100
        };

        // State
        let cols, rows;
        let mouse = { x: -1000, y: -1000 };
        let smoothMouse = { x: -1000, y: -1000 };
        let isMouseActive = false;
        let time = 0;
        let animationId;

        function init() {
            resize();
            window.addEventListener('resize', resize);

            document.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                isMouseActive = true;
            });

            document.addEventListener('mouseleave', () => {
                isMouseActive = false;
            });

            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    mouse.x = e.touches[0].clientX;
                    mouse.y = e.touches[0].clientY;
                    isMouseActive = true;
                }
            }, { passive: true });

            document.addEventListener('touchend', () => {
                isMouseActive = false;
            });

            animate();
        }

        function resize() {
            cols = Math.floor(window.innerWidth / config.charWidth);
            rows = Math.floor(window.innerHeight / config.charHeight);
        }

        function getWaveValue(x, y, t) {
            // Normalized coordinates
            const nx = x / cols;
            const ny = y / rows;

            // Multiple overlapping waves for organic feel
            let value = 0;

            // Primary horizontal wave
            value += Math.sin(nx * 8 + t) * 0.3;

            // Secondary vertical wave
            value += Math.sin(ny * 6 + t * 0.7) * 0.25;

            // Diagonal wave
            value += Math.sin((nx + ny) * 5 + t * 1.2) * 0.2;

            // Circular ripple from center
            const cx = nx - 0.5;
            const cy = ny - 0.5;
            const dist = Math.sqrt(cx * cx + cy * cy);
            value += Math.sin(dist * 12 - t * 0.8) * 0.25;

            // Normalize to 0-1
            return (value + 1) / 2;
        }

        function animate() {
            time += 0.02 * config.waveSpeed;

            // Smooth mouse position
            smoothMouse.x += (mouse.x - smoothMouse.x) * 0.12;
            smoothMouse.y += (mouse.y - smoothMouse.y) * 0.12;

            let ascii = '';
            let hasHole = false;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Pixel position
                    const pixelX = x * config.charWidth + config.charWidth / 2;
                    const pixelY = y * config.charHeight + config.charHeight / 2;

                    // Distance from mouse
                    const dx = pixelX - smoothMouse.x;
                    const dy = pixelY - smoothMouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    // Mouse hole effect
                    const holeAmount = isMouseActive ? Math.max(0, 1 - distance / config.mouseRadius) : 0;
                    const smoothHole = holeAmount * holeAmount; // Ease the falloff

                    if (smoothHole > 0.3) {
                        hasHole = true;
                    }

                    if (smoothHole > 0.7) {
                        ascii += ' ';
                    } else {
                        // Get wave value and apply hole fade
                        const waveValue = getWaveValue(x, y, time);
                        const adjustedValue = waveValue * (1 - smoothHole);

                        // Map to ASCII character
                        const charIndex = Math.floor(adjustedValue * (ASCII_CHARS.length - 1));
                        ascii += ASCII_CHARS[Math.max(0, Math.min(ASCII_CHARS.length - 1, charIndex))];
                    }
                }
                ascii += '\n';
            }

            document.getElementById('ascii-output').textContent = ascii;

            // Show/hide info layer
            const infoLayer = document.getElementById('info-layer');
            if (hasHole) {
                infoLayer.classList.add('visible');
            } else {
                infoLayer.classList.remove('visible');
            }

            animationId = requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
