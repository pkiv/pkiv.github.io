<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul Klein</title>
    <style>
        @font-face {
            font-family: 'Aeonik';
            src: url('Aeonik-Medium.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        #container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 60px;
        }

        #ascii-container {
            width: 100%;
            height: 100%;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            line-height: 12px;
            white-space: pre;
            color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ascii-output {
            letter-spacing: 1px;
        }

        #info-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #info-layer.visible {
            opacity: 1;
        }

        .info-content {
            text-align: center;
            color: #000;
            font-family: 'Aeonik', 'Helvetica Neue', Arial, sans-serif;
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem 3rem;
            border-radius: 4px;
        }

        .info-content h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 500;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .info-content p {
            font-size: clamp(0.75rem, 1.5vw, 1.1rem);
            opacity: 0.6;
            margin-bottom: 0.25rem;
        }

        .info-content .email {
            margin-top: 1rem;
            opacity: 1;
        }

        .info-content a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            padding-bottom: 2px;
            transition: border-color 0.3s;
            pointer-events: auto;
        }

        .info-content a:hover {
            border-color: #000;
        }

        .hint {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #aaa;
            z-index: 10;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        #three-canvas {
            position: fixed;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div id="info-layer">
        <div class="info-content">
            <h1>Paul Klein</h1>
            <p>Code Creator & Problem Solver</p>
            <p>San Francisco</p>
            <p class="email">
                <a href="mailto:paul@paulkle.in">paul@paulkle.in</a>
            </p>
        </div>
    </div>

    <div id="container">
        <div id="ascii-container">
            <pre id="ascii-output"></pre>
        </div>
    </div>

    <div class="hint">hover to reveal</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ASCII characters from dark to light (last char is space for white bg)
        const ASCII_CHARS = '@%#*+=-:. ';

        // Configuration
        const config = {
            charWidth: 6,
            charHeight: 12,
            margin: { top: 40, right: 60, bottom: 40, left: 60 },
            waveSpeed: 1.0,
            waveHeight: 3,
            mouseRadius: 120
        };

        // State
        let cols, rows, renderWidth, renderHeight;
        let mouse = { x: -1000, y: -1000 };
        let smoothMouse = { x: -1000, y: -1000 };
        let isMouseActive = false;
        let time = 0;

        // Three.js components
        let scene, camera, renderer, plane;

        function initThree() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            // Isometric-style camera
            const aspect = cols / rows;
            const frustumSize = 20;
            camera = new THREE.OrthographicCamera(
                -frustumSize * aspect / 2,
                frustumSize * aspect / 2,
                frustumSize / 2,
                -frustumSize / 2,
                0.1,
                1000
            );

            // Isometric angle
            camera.position.set(20, 20, 20);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(cols, rows);
            renderer.setPixelRatio(1);
            document.body.appendChild(renderer.domElement);
            renderer.domElement.id = 'three-canvas';

            // Create wave plane
            const geometry = new THREE.PlaneGeometry(30, 30, 80, 80);
            const material = new THREE.MeshBasicMaterial({
                color: 0x000000,
                wireframe: true,
                wireframeLinewidth: 1
            });

            plane = new THREE.Mesh(geometry, material);
            plane.rotation.x = -Math.PI / 2;
            scene.add(plane);

            // Add some depth with additional planes
            const bgMaterial = new THREE.MeshBasicMaterial({
                color: 0x333333,
                wireframe: true
            });

            for (let i = 1; i <= 3; i++) {
                const bgPlane = new THREE.Mesh(
                    new THREE.PlaneGeometry(30, 30, 40, 40),
                    bgMaterial.clone()
                );
                bgPlane.rotation.x = -Math.PI / 2;
                bgPlane.position.y = -i * 2;
                bgPlane.material.opacity = 0.3 / i;
                bgPlane.material.transparent = true;
                scene.add(bgPlane);
            }
        }

        function updateWave() {
            if (!plane) return;

            const positions = plane.geometry.attributes.position;
            const vertex = new THREE.Vector3();

            for (let i = 0; i < positions.count; i++) {
                vertex.fromBufferAttribute(positions, i);

                const x = vertex.x;
                const y = vertex.y;

                // Multiple wave layers for organic feel
                let z = 0;
                z += Math.sin(x * 0.3 + time) * config.waveHeight * 0.5;
                z += Math.sin(y * 0.4 + time * 0.8) * config.waveHeight * 0.3;
                z += Math.sin((x + y) * 0.2 + time * 1.2) * config.waveHeight * 0.4;
                z += Math.sin(Math.sqrt(x * x + y * y) * 0.3 - time * 0.6) * config.waveHeight * 0.3;

                positions.setZ(i, z);
            }

            positions.needsUpdate = true;
            plane.geometry.computeVertexNormals();
        }

        function renderToAscii() {
            renderer.render(scene, camera);

            const gl = renderer.getContext();
            const pixels = new Uint8Array(cols * rows * 4);
            gl.readPixels(0, 0, cols, rows, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

            // Smooth mouse position
            smoothMouse.x += (mouse.x - smoothMouse.x) * 0.12;
            smoothMouse.y += (mouse.y - smoothMouse.y) * 0.12;

            let ascii = '';
            let hasHole = false;

            // Calculate ASCII area bounds (accounting for margins)
            const asciiStartX = config.margin.left;
            const asciiStartY = config.margin.top;

            for (let y = rows - 1; y >= 0; y--) {
                for (let x = 0; x < cols; x++) {
                    // Calculate screen position
                    const screenX = asciiStartX + x * config.charWidth + config.charWidth / 2;
                    const screenY = asciiStartY + (rows - 1 - y) * config.charHeight + config.charHeight / 2;

                    // Distance from mouse
                    const dx = screenX - smoothMouse.x;
                    const dy = screenY - smoothMouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    // Mouse hole effect
                    const holeAmount = isMouseActive ? Math.max(0, 1 - distance / config.mouseRadius) : 0;
                    const smoothHole = holeAmount * holeAmount * holeAmount;

                    if (smoothHole > 0.3) {
                        hasHole = true;
                    }

                    if (smoothHole > 0.6) {
                        ascii += ' ';
                    } else {
                        const i = (y * cols + x) * 4;
                        const brightness = (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;

                        // Pure white background = space (sky above horizon)
                        if (brightness > 250) {
                            ascii += ' ';
                        } else {
                            // Apply hole fade
                            const adjustedBrightness = brightness + smoothHole * 200;

                            // Map brightness to ASCII (invert so dark = dense chars)
                            const charIndex = Math.floor((adjustedBrightness / 255) * (ASCII_CHARS.length - 1));
                            ascii += ASCII_CHARS[Math.max(0, Math.min(ASCII_CHARS.length - 1, charIndex))];
                        }
                    }
                }
                ascii += '\n';
            }

            document.getElementById('ascii-output').textContent = ascii;

            // Show/hide info layer
            const infoLayer = document.getElementById('info-layer');
            if (hasHole) {
                infoLayer.classList.add('visible');
            } else {
                infoLayer.classList.remove('visible');
            }
        }

        function resize() {
            const container = document.getElementById('container');
            renderWidth = container.clientWidth;
            renderHeight = container.clientHeight;

            cols = Math.floor(renderWidth / config.charWidth);
            rows = Math.floor(renderHeight / config.charHeight);

            if (renderer) {
                renderer.setSize(cols, rows);

                const aspect = cols / rows;
                const frustumSize = 20;
                camera.left = -frustumSize * aspect / 2;
                camera.right = frustumSize * aspect / 2;
                camera.top = frustumSize / 2;
                camera.bottom = -frustumSize / 2;
                camera.updateProjectionMatrix();
            }
        }

        function animate() {
            time += 0.015 * config.waveSpeed;

            updateWave();
            renderToAscii();

            requestAnimationFrame(animate);
        }

        function init() {
            resize();
            initThree();

            window.addEventListener('resize', () => {
                resize();
            });

            document.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                isMouseActive = true;
            });

            document.addEventListener('mouseleave', () => {
                isMouseActive = false;
            });

            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    mouse.x = e.touches[0].clientX;
                    mouse.y = e.touches[0].clientY;
                    isMouseActive = true;
                }
            }, { passive: true });

            document.addEventListener('touchend', () => {
                isMouseActive = false;
            });

            animate();
        }

        init();
    </script>
</body>
</html>
