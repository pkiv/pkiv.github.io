<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul Klein</title>
    <style>
        @font-face {
            font-family: 'Aeonik';
            src: url('Aeonik-Medium.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #fff;
            overflow: hidden;
        }

        #wave {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            font-family: monospace;
            font-size: 10px;
            line-height: 12px;
            white-space: pre;
            color: #000;
            overflow: hidden;
            z-index: 1;
        }

        #info-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #info-layer.visible {
            opacity: 1;
        }

        .info-content {
            text-align: center;
            color: #000;
            font-family: 'Aeonik', 'Helvetica Neue', Arial, sans-serif;
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem 3rem;
            border-radius: 4px;
        }

        .info-content h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 500;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .info-content p {
            font-size: clamp(0.75rem, 1.5vw, 1.1rem);
            opacity: 0.6;
            margin-bottom: 0.25rem;
        }

        .info-content .email {
            margin-top: 1rem;
            opacity: 1;
        }

        .info-content a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            padding-bottom: 2px;
            transition: border-color 0.3s;
            pointer-events: auto;
        }

        .info-content a:hover {
            border-color: #000;
        }

        .hint {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #999;
            z-index: 10;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="info-layer">
        <div class="info-content">
            <h1>Paul Klein</h1>
            <p>Code Creator & Problem Solver</p>
            <p>San Francisco</p>
            <p class="email">
                <a href="mailto:paul@paulkle.in">paul@paulkle.in</a>
            </p>
        </div>
    </div>

    <pre id="wave"></pre>

    <div class="hint">hover to reveal</div>

    <script>
        const chars = '~-=+*#%@';
        let time = 0;
        let mouse = { x: -1000, y: -1000 };
        let active = false;

        function render() {
            const w = Math.floor(window.innerWidth / 6);
            const h = Math.floor(window.innerHeight * 0.6 / 12);
            let out = '';
            let hole = false;

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const px = x * 6 + 3;
                    const py = window.innerHeight * 0.4 + y * 12 + 6;

                    const dx = px - mouse.x;
                    const dy = py - mouse.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const holeAmt = active ? Math.max(0, 1 - dist/100) : 0;

                    if (holeAmt > 0.3) hole = true;

                    if (holeAmt > 0.5) {
                        out += ' ';
                        continue;
                    }

                    const nx = x / w;
                    const ny = y / h;

                    // Wave surface
                    const wave =
                        Math.sin(nx * 6 + time) * 0.3 +
                        Math.sin(nx * 10 - time * 0.7) * 0.2 +
                        Math.sin(nx * 4 + time * 1.3) * 0.15;

                    const surface = 0.3 + wave * 0.3;

                    if (ny < surface) {
                        out += ' ';
                    } else {
                        const depth = (ny - surface) / (1 - surface);
                        let density = depth * 0.8;

                        // Wave lines
                        density += Math.sin(nx * 20 + ny * 10 + time * 0.5) * 0.1;

                        // Fade with mouse
                        density *= (1 - holeAmt);

                        const idx = Math.floor(density * (chars.length - 1));
                        out += chars[Math.max(0, Math.min(chars.length - 1, idx))];
                    }
                }
                out += '\n';
            }

            document.getElementById('wave').textContent = out;
            document.getElementById('info-layer').classList.toggle('visible', hole);

            time += 0.03;
            requestAnimationFrame(render);
        }

        document.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            active = true;
        });

        document.addEventListener('mouseleave', () => active = false);

        document.addEventListener('touchmove', e => {
            if (e.touches[0]) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
                active = true;
            }
        }, { passive: true });

        document.addEventListener('touchend', () => active = false);

        render();
    </script>
</body>
</html>
