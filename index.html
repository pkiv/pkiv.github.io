<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul Klein</title>
    <style>
        @font-face {
            font-family: 'Aeonik';
            src: url('Aeonik-Medium.ttf') format('truetype');
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #fff;
            overflow: hidden;
        }
        #wave {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Courier New', monospace;
            font-size: 7px;
            line-height: 8px;
            letter-spacing: 0px;
            white-space: pre;
            color: #000;
            user-select: none;
        }
        #info-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #info-layer.visible { opacity: 1; }
        .info-content {
            text-align: center;
            color: #000;
            font-family: 'Aeonik', sans-serif;
            background: rgba(255,255,255,0.95);
            padding: 2rem 3rem;
            border-radius: 4px;
        }
        .info-content h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        .info-content p {
            font-size: clamp(0.75rem, 1.5vw, 1.1rem);
            opacity: 0.6;
            margin-bottom: 0.25rem;
        }
        .info-content .email { margin-top: 1rem; opacity: 1; }
        .info-content a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            pointer-events: auto;
        }
        .hint {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #aaa;
            z-index: 10;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="info-layer">
        <div class="info-content">
            <h1>Paul Klein</h1>
            <p>Code Creator & Problem Solver</p>
            <p>San Francisco</p>
            <p class="email">
                <a href="mailto:paul@paulkle.in">paul@paulkle.in</a>
            </p>
        </div>
    </div>
    <pre id="wave"></pre>
    <div class="hint">hover to reveal</div>

    <script>
        // ASCII characters by density (light to dark)
        const ASCII = ' .,-~:;=!*#$@';

        const COLS = 140;
        const ROWS = 70;

        let time = 0;
        let mouse = { x: -9999, y: -9999 };
        let mouseActive = false;

        // Simplex-like noise for fluid motion
        function noise(x, y, t) {
            return (
                Math.sin(x * 0.5 + t) * 0.5 +
                Math.sin(y * 0.3 + t * 0.7) * 0.3 +
                Math.sin((x + y) * 0.2 + t * 1.1) * 0.2 +
                Math.sin(Math.sqrt(x*x + y*y) * 0.3 - t * 0.5) * 0.3
            );
        }

        // Project 3D isometric to 2D
        function project(x, y, z) {
            // Isometric projection
            const isoX = (x - z) * Math.cos(Math.PI / 6);
            const isoY = (x + z) * Math.sin(Math.PI / 6) - y;
            return { x: isoX, y: isoY };
        }

        // Great Wave height function
        function getWaveHeight(x, z, t) {
            const nx = (x + 20) / 40; // normalize to 0-1

            let height = 0;

            // Main curling wave (the big one)
            const mainPeak = 0.25;
            const distMain = nx - mainPeak;

            if (nx < 0.55) {
                // Rising wave
                const rise = Math.pow(Math.max(0, 1 - Math.abs(distMain) * 2.2), 2);
                height += rise * 15;

                // The iconic curl at the top
                if (nx > 0.12 && nx < 0.42) {
                    const curlPos = (nx - 0.12) / 0.3;
                    const curl = Math.sin(curlPos * Math.PI);
                    const curlHeight = curl * 5 * Math.exp(-distMain * distMain * 12);
                    height += curlHeight;
                }
            }

            // Secondary wave
            const dist2 = Math.abs(nx - 0.68);
            height += Math.exp(-dist2 * dist2 * 35) * 7;

            // Third wave
            const dist3 = Math.abs(nx - 0.85);
            height += Math.exp(-dist3 * dist3 * 50) * 4;

            // Fluid motion - multiple wave frequencies
            const flow = noise(nx * 8, z * 0.3, t * 0.8);
            height += flow * 1.5;

            // Rolling motion at the crest
            if (nx > 0.1 && nx < 0.4) {
                height += Math.sin(nx * 20 - t * 3) * 0.8 * (1 - Math.abs(distMain) * 5);
            }

            // Depth variation
            const zFade = Math.exp(-z * z / 400);
            height *= zFade;

            // Base level ripples
            height += Math.sin(nx * 30 + t * 2) * 0.2 * zFade;
            height += Math.sin(z * 0.5 + t * 1.5) * 0.3 * zFade;

            return Math.max(0, height);
        }

        function render() {
            time += 0.025;

            const waveEl = document.getElementById('wave');
            const rect = waveEl.getBoundingClientRect();
            const charW = rect.width / COLS;
            const charH = rect.height / ROWS;

            // Build height map with isometric projection
            const heightMap = new Array(ROWS).fill(null).map(() => new Array(COLS).fill(0));
            const depthMap = new Array(ROWS).fill(null).map(() => new Array(COLS).fill(-Infinity));

            // Sample 3D points and project to 2D (dense grid)
            const gridX = 200;
            const gridZ = 120;

            for (let i = 0; i < gridX; i++) {
                for (let j = 0; j < gridZ; j++) {
                    const x3d = (i / gridX - 0.5) * 40;
                    const z3d = (j / gridZ - 0.5) * 25;
                    const y3d = getWaveHeight(x3d, z3d, time);

                    // Project to 2D isometric
                    const p = project(x3d, y3d, z3d);

                    // Map to character grid
                    const col = Math.floor((p.x / 35 + 0.5) * COLS);
                    const row = Math.floor((0.5 - p.y / 25) * ROWS);

                    if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
                        // Z-buffer style: only draw if this point is closer
                        const depth = -z3d + y3d * 0.5;
                        if (depth > depthMap[row][col]) {
                            depthMap[row][col] = depth;
                            // Height determines character density
                            const intensity = Math.min(1, y3d / 12);
                            heightMap[row][col] = intensity;
                        }
                    }
                }
            }

            // Convert to ASCII
            let output = '';
            let hasHole = false;

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    // Screen position
                    const screenX = rect.left + col * charW + charW / 2;
                    const screenY = rect.top + row * charH + charH / 2;

                    // Mouse hole
                    const dx = screenX - mouse.x;
                    const dy = screenY - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const hole = mouseActive ? Math.pow(Math.max(0, 1 - dist / 100), 2) : 0;

                    if (hole > 0.3) hasHole = true;

                    const intensity = heightMap[row][col];

                    if (intensity < 0.01 || hole > 0.6) {
                        output += ' ';
                    } else {
                        // Reduce intensity near mouse, boost overall
                        const adj = Math.min(1, intensity * 1.3) * (1 - hole * 0.8);
                        const idx = Math.floor(adj * (ASCII.length - 1));
                        output += ASCII[Math.min(ASCII.length - 1, Math.max(0, idx))];
                    }
                }
                output += '\n';
            }

            waveEl.textContent = output;

            const infoLayer = document.getElementById('info-layer');
            infoLayer.classList.toggle('visible', hasHole);

            requestAnimationFrame(render);
        }

        // Events
        document.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouseActive = true;
        });
        document.addEventListener('mouseleave', () => mouseActive = false);
        document.addEventListener('touchmove', e => {
            if (e.touches[0]) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
                mouseActive = true;
            }
        }, { passive: true });
        document.addEventListener('touchend', () => mouseActive = false);

        render();
    </script>
</body>
</html>
