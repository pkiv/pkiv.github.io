<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul Klein</title>
    <style>
        @font-face {
            font-family: 'Aeonik';
            src: url('Aeonik-Medium.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        #ascii-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            line-height: 10px;
            white-space: pre;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #ascii-output {
            letter-spacing: 2px;
        }

        #info-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #info-layer.visible {
            opacity: 1;
        }

        .info-content {
            text-align: center;
            color: #000;
            font-family: 'Aeonik', 'Helvetica Neue', Arial, sans-serif;
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem 3rem;
            border-radius: 4px;
        }

        .info-content h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 500;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .info-content p {
            font-size: clamp(0.75rem, 1.5vw, 1.1rem);
            opacity: 0.6;
            margin-bottom: 0.25rem;
        }

        .info-content .email {
            margin-top: 1rem;
            opacity: 1;
        }

        .info-content a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            padding-bottom: 2px;
            transition: border-color 0.3s;
            pointer-events: auto;
        }

        .info-content a:hover {
            border-color: #000;
        }

        .hint {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #aaa;
            z-index: 10;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div id="info-layer">
        <div class="info-content">
            <h1>Paul Klein</h1>
            <p>Code Creator & Problem Solver</p>
            <p>San Francisco</p>
            <p class="email">
                <a href="mailto:paul@paulkle.in">paul@paulkle.in</a>
            </p>
        </div>
    </div>

    <div id="ascii-container">
        <div id="ascii-output"></div>
    </div>

    <div class="hint">hover to reveal</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ASCII gradient from dense to sparse
        const ASCII_CHARS = ' .:-=+*#%@';

        // Configuration
        const config = {
            charWidth: 6,
            charHeight: 10,
            waveSpeed: 1.2,
            waveAmplitude: 2.5,
            waveFrequency: 0.15,
            mouseRadius: 120,
            depth: 8
        };

        // State
        let width, height, cols, rows;
        let mouse = { x: -1000, y: -1000 };
        let smoothMouse = { x: -1000, y: -1000 };
        let isMouseActive = false;
        let time = 0;

        // Three.js setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        // Hidden canvas for 3D rendering
        renderer.setPixelRatio(1);
        renderer.setClearColor(0xffffff, 1);
        document.body.appendChild(renderer.domElement);

        // Create wave geometry
        let geometry, material, points;

        function createWaveField() {
            if (points) {
                scene.remove(points);
                geometry.dispose();
                material.dispose();
            }

            const positions = [];
            const gridSize = 100;
            const spacing = 0.5;

            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    const x = (i - gridSize / 2) * spacing;
                    const z = (j - gridSize / 2) * spacing;
                    positions.push(x, 0, z);
                }
            }

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

            material = new THREE.PointsMaterial({
                color: 0x000000,
                size: 0.15,
                sizeAttenuation: true
            });

            points = new THREE.Points(geometry, material);
            scene.add(points);
        }

        function init() {
            resize();
            createWaveField();

            camera.position.set(0, 25, 35);
            camera.lookAt(0, 0, 0);

            window.addEventListener('resize', resize);

            document.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                isMouseActive = true;
            });

            document.addEventListener('mouseleave', () => {
                isMouseActive = false;
            });

            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    mouse.x = e.touches[0].clientX;
                    mouse.y = e.touches[0].clientY;
                    isMouseActive = true;
                }
            }, { passive: true });

            document.addEventListener('touchend', () => {
                isMouseActive = false;
            });

            animate();
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;

            cols = Math.floor(width / config.charWidth);
            rows = Math.floor(height / config.charHeight);

            renderer.setSize(cols, rows);
            camera.aspect = cols / rows;
            camera.updateProjectionMatrix();
        }

        function updateWave() {
            if (!points) return;

            const positions = geometry.attributes.position.array;
            const gridSize = 100;

            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    const index = (i * gridSize + j) * 3;
                    const x = positions[index];
                    const z = positions[index + 2];

                    // Multiple overlapping waves
                    let y = 0;
                    y += Math.sin(x * config.waveFrequency + time) * config.waveAmplitude;
                    y += Math.sin(z * config.waveFrequency * 0.8 + time * 0.7) * config.waveAmplitude * 0.6;
                    y += Math.sin((x + z) * config.waveFrequency * 0.5 + time * 1.3) * config.waveAmplitude * 0.4;
                    y += Math.sin(Math.sqrt(x * x + z * z) * config.waveFrequency * 0.4 + time * 0.5) * config.waveAmplitude * 0.5;

                    positions[index + 1] = y;
                }
            }

            geometry.attributes.position.needsUpdate = true;
        }

        function renderToAscii() {
            renderer.render(scene, camera);

            const gl = renderer.getContext();
            const pixels = new Uint8Array(cols * rows * 4);
            gl.readPixels(0, 0, cols, rows, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

            let ascii = '';

            // Smooth mouse position
            smoothMouse.x += (mouse.x - smoothMouse.x) * 0.15;
            smoothMouse.y += (mouse.y - smoothMouse.y) * 0.15;

            const infoLayer = document.getElementById('info-layer');
            let hasHole = false;

            // Read pixels and convert to ASCII (flip Y since WebGL is bottom-up)
            for (let y = rows - 1; y >= 0; y--) {
                for (let x = 0; x < cols; x++) {
                    const pixelX = x * config.charWidth + config.charWidth / 2;
                    const pixelY = (rows - 1 - y) * config.charHeight + config.charHeight / 2;

                    // Calculate distance from mouse
                    const dx = pixelX - smoothMouse.x;
                    const dy = pixelY - smoothMouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    // Mouse hole effect
                    const holeAmount = isMouseActive ? Math.max(0, 1 - distance / config.mouseRadius) : 0;

                    if (holeAmount > 0.5) {
                        hasHole = true;
                    }

                    if (holeAmount > 0.8) {
                        ascii += ' ';
                    } else {
                        const i = (y * cols + x) * 4;
                        // Invert brightness (white bg, black dots)
                        const brightness = (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;

                        // Apply hole effect to brightness
                        const adjustedBrightness = brightness + holeAmount * 255;

                        const charIndex = Math.floor((1 - Math.min(adjustedBrightness, 255) / 255) * (ASCII_CHARS.length - 1));
                        ascii += ASCII_CHARS[Math.max(0, Math.min(ASCII_CHARS.length - 1, charIndex))];
                    }
                }
                ascii += '\n';
            }

            document.getElementById('ascii-output').textContent = ascii;

            // Show/hide info layer based on mouse hole
            if (hasHole) {
                infoLayer.classList.add('visible');
            } else {
                infoLayer.classList.remove('visible');
            }
        }

        function animate() {
            time += 0.02 * config.waveSpeed;

            updateWave();
            renderToAscii();

            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
